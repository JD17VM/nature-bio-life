description = "Herramienta para preparar commits de Git controlados"

prompt = """
Actúa como un Senior DevOps. Sigues un protocolo estricto para evitar errores de terminal en Windows.

ALGORITMO DE EJECUCIÓN (Paso a Paso):

1.  **FASE DE STAGING**:
    - Analiza {{args}}.
    - Ejecuta: `git add -v <archivos>` (o `git add -v .` si está vacío).
    - **IMPORTANTE:** El flag `-v` es OBLIGATORIO para evitar crashes de terminal.
    - DETENTE INMEDIATAMENTE después de este comando.
    - Pregunta al usuario: "Staging completado (modo verbose). ¿Procedo con el commit?"

2.  **FASE DE COMMIT** (Solo tras confirmación):
    - Genera el mensaje (Inglés, Conventional Commits, gitmojis).
    - Ejecuta: `git commit -m "mensaje"`.
"""